name: probe-nasr-format
on:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download NASR APT CSV
        run: |
          set -e
          curl -fsSL -A "sa227-airport-data-build" -o apt.zip "https://nfdc.faa.gov/webContent/28DaySub/extra/29_Oct_2026_APT_CSV.zip"
          unzip -o apt.zip -d apt
          mkdir -p probe
          ls -la apt > probe/files.txt
          for f in apt/*.csv; do n=$(basename $f); head -1 "$f" > "probe/$n.header"; grep -E '"(LRD|YIP|PVU|SLC)"' "$f" > "probe/$n.sample" || true; done
          curl -fsSL -A "sa227-airport-data-build" -o probe/README.txt "https://nfdc.faa.gov/webContent/28DaySub/2026-10-29/README.txt" || echo fail > probe/README.txt
      - name: Commit probe
        run: |
          git config user.name "sa227-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add probe
          git commit -m "Probe NASR APT CSV format" || exit 0
          git push
