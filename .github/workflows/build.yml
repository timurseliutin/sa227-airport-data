name: build-airport-data
on:
  schedule:
    - cron: '23 9 * * *'     # daily 09:23 UTC (AIRAC effective time is 0901Z)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/build.yml']
permissions:
  contents: write
concurrency:
  group: build-airport-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pygeomag==1.1.0
      - name: Build current and next cycle
        id: build
        shell: bash
        run: |
          set -o pipefail
          python -u tools/publish.py 2>&1 | tee last-build.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "sa227-data-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ "${{ steps.build.outcome }}" = "success" ]; then git add -A dist; fi
          git add last-build.txt
          git diff --cached --quiet && exit 0
          git commit -m "Airport data build ${{ steps.build.outcome }}"
          git push
